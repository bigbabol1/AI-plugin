  phone_seen_at:       "O Home Assistant viu-o pela última vez em {place}."
  phone_seen_away:     "O Home Assistant viu-o pela última vez fora de casa."
  phone_ring_text:     "Estou aqui!"
  phone_failed:        "Não consegui contactar o telefone."
  alarm_ring:          "O teu alarme está a tocar."
  alarm_wake:          "Está na hora de acordar."
  alarm_stopped:       "Alarme desligado."
  alarm_snoozed:       "O alarme volta a tocar daqui a {val} minutos."
  reminder_due:        "Lembrete: {label}."
  reminder_title:      "Lembrete"
  scheduled_say:       "{label}"
  scheduled_failed:    "Não consegui fazer isto: {label}."
  message_title:       "Mensagem"
  message_title_from:  "Mensagem de {name}"
  phrase_routine_refused: "Ainda não consigo guardar uma frase para isso, por isso não ficou nada definido. Posso fazê-lo a uma hora certa se me disseres quando."
  remember_not_saved: "Não guardei isso. Se quiseres que me lembre, diz lembra e depois o quê."
  remember_not_saved_short: "Não guardei isso."
  second_room_refused: "Não consigo tocar em duas divisões ao mesmo tempo. Posso mover a música se quiseres."
  broadcast_what: "O que queres que anuncie?"
  broadcast_sent: "Disse-o nas outras divisões."
  broadcast_failed: "Não consegui anunciar isso."
  broadcast_cancelled: "Está bem, não anuncio nada."
  message_sent_to: "Enviado a {name}: {label}"
  message_not_sent: "Não consegui enviar isso."
  calendar_not_removed: "Não apaguei nada. Que compromisso quer dizer?"
  diary_forgotten: "Esqueci as nossas conversas anteriores."
  diary_forgotten_none: "Não havia nada guardado de conversas anteriores."
  message_cancelled: "Está bem, não envio nada."
  schedule_not_changed: "Não alterei nada. Diz-me a nova hora e eu altero."
  schedule_switched_off: "Aqui não consigo definir alarmes nem lembretes, por isso nada foi definido."
keywords:
  time_now:      ["que horas são", "que horas sao", "diga as horas"]
  sun_set:       ["pôr do sol", "quando se põe o sol", "a que horas se põe o sol"]
  sun_rise:      ["nascer do sol", "quando nasce o sol", "a que horas nasce o sol"]
  sun_dark:      ["está escuro", "está claro"]
  sun_is_up:     ["o sol está alto"]
  narration:     ["estou a verificar", "estou a procurar", "estou a olhar", "vou verificar", "vou procurar"]

patterns:
  # Forgetting the conversation diary, not a saved fact.
  diary_forget:
    - '\besquece\s+(?:todas\s+)?(?:as\s+)?(?:nossas|minhas|essas)\s+conversas\b'
    - '\b(?:apaga|apague|elimina)\s+(?:todas\s+)?(?:as\s+)?(?:nossas|minhas)\s+conversas\b'
  narration_full: []
  action_on:
    - '^(?:liga|ligar|ligue|ativa|ativar|acende|acender)\s+(?:o|a|os|as|um|uma)?\s*(?P<name>.+?)$'
  action_off:
    - '^(?:desliga|desligar|desligue|desativa|desativar|apaga|apagar)\s+(?:o|a|os|as)?\s*(?P<name>.+?)$'
  action_open:
    - '^(?:abre|abrir|abra)\s+(?:o\s+|a\s+|os\s+|as\s+)?(?P<name>.+?)$'
  action_close:
    - '^(?:fecha|fechar|feche)\s+(?:o\s+|a\s+|os\s+|as\s+)?(?P<name>.+?)$'
  # "Where is my phone": rings it. An optional
  # (?P<owner>...) captures someone else's name; without it the phone is the speaker's.
  find_phone:
    - '^(?:onde\s+(?:está|esta)|cadê|cade)\s+(?:o\s+)?meu\s+(?:telemóvel|telemovel|celular|telefone|iphone)$'
    - '^(?:encontra|procura|liga\s+para|faz\s+tocar)\s+(?:o\s+)?meu\s+(?:telemóvel|telemovel|celular|telefone|iphone)$'
    - '^não\s+encontro\s+(?:o\s+)?meu\s+(?:telemóvel|telemovel|celular|telefone|iphone)$'
    - '^(?:onde\s+(?:está|esta)|cadê|cade)\s+o\s+(?:telemóvel|telemovel|celular|telefone|iphone)\s+(?:da|do|de)\s+(?P<owner>[\w\-]+)$'
  # While an alarm rings: the words that stop it.
  alarm_stop:
    - '^(?:para|parar|chega|desliga|já\s+acordei|(?:para|desliga)\s+(?:o\s+)?alarme)$'
  # While an alarm rings: snooze, with an optional (?P<minutes>).
  alarm_snooze:
    - '^(?:snooze|soneca|adiar)(?:\s+(?P<minutes>\d+)\s*min\w*)?$'
    - '^mais\s+(?P<minutes>\d+)\s+minutos$'
  # A time in the future inside a command: such a command is scheduled, never run at once, and these are cut from it.
  later_time:
    - '\b(?:em|daqui\s+a)\s+(?:\d+|uma?|dois|duas|três|cinco|dez|quinze|vinte|trinta|meia)\s+(?:segundos?|minutos?|horas?)\b'
    - '\bàs?\s+\d{1,2}(?:[:.h]\d{2})?(?!\s*%|\d)'
    - '\bamanhã\b'
    - '\besta\s+noite\b'
    - '\bmais\s+tarde\b'
    - '\btodos\s+os\s+dias\b'
  # A reply saying a fact was saved; said with nothing saved, it is replaced by remember_not_saved.
  saved_claim:
    - '(?<!não\s)\b(?:anotei|guardei|memorizei)\b'
    - '\bvou\s+lembrar\b'
    - '\blembrar[- ]me[- ]ei\b'
  # A reply saying a reminder or alarm was moved. Checked against what the turn really did.
  schedule_changed_claim:
    - '(?<!não\s)(?<!nao\s)\b(?:(?:atualizad|alterad|mudad|movid|ajustad|corrigid|reagendad)[oa]s?|atualizei|alterei|mudei|movi|ajustei|corrigi|reagendei)(?!\w)'
  # Words for a reminder or alarm, to tell such a claim from one about a calendar entry.
  schedule_thing:
    - '\b(?:lembretes?|alarmes?)\b'
  # A user correcting something they just asked for: a new reminder then replaces its old twin.
  schedule_correction:
    - '\b(?:culpa\s+minha|na\s+verdade|em\s+vez|queria\s+dizer|desculpa|correção|engano|errado|errei|mud\w*|alter\w*|mov\w*)\b'
    - '^não\b'
  # A user asking for one more: the old reminder stays even if the wording sounds like a correction.
  schedule_keep_both:
    - '\b(?:também|outr[oa]|adicional|além\s+disso|segund\w*)\b'
  # A command for the room the satellite is in.
  # The room something is moved to is the speaker's own: "move the music here".
  move_here:
    - '\bpara\s+(?:aqui|c[áa]|esta\s+sala|este\s+quarto)\b'
    - '(?<!\bde\s)\b(?:aqui|c[áa])(?:\s+por\s+favor)?[\s.!?]*$'
  # A reply saying something was done. With nothing done, it is replaced by err_action_failed.
  action_done_claim:
    - '(?:^|[.!?,]\s+)(?:já\s+)?(?:anunciei|movi|adicionei|removi|apaguei|liguei|desliguei|parei|mudei|alterei)\b'
  # Music in a second room as well, which the plugin cannot do: "also play in the bathroom".
  second_room:
    - '\b(?:toca|põe|reproduz)\b.*\btamb[ée]m\s+(?:em|no|na|aqui|ali)\b'
    - '\b(?:toca|põe|reproduz)\b.*\bem\s+(?:dois|duas|v[áa]rios|v[áa]rias)\s+(?:quartos|salas|divis[õo]es)\b'
  # "Broadcast." and nothing to say yet: the next thing said is the message.
  broadcast_empty:
    - '^(?:por\s+favor\s+)?(?:anuncia|faz\s+um\s+anúncio|broadcast)(?:\s+algo)?$'
  # Asking for an announcement, in any wording, and the assistant asking what to say.
  broadcast_word:
    - '\b(?:anuncia|anunciar|anuncie|anúncio|broadcast)\b'
  # Taking that back instead of giving the message.
  broadcast_cancel:
    - '^(?:não[,\s]+)?(?:deixa|esquece|cancela|cancelar|nada|para)$'
  # The assistant asking what to say to one person: the next thing said is the message.
  message_asked:
    - '^(?:o\s+)?(?:que|qual)\b.*\b(?:diga|dizer|escreva|escrever|envie|enviar|mande|mandar|mensagem)\b'
  # Correcting who a message is for: not itself a message.
  message_correction:
    - '^(?:não[,\s]+)?não\s+(?:a|para)\b'
  # A reply saying a message went out. "Already sent" stays out: it can be true.
  message_sent_claim:
    - '(?:^|[.!?,]\s+)(?:enviei|mandei)\b'
  this_room:
    - '\b(?:aqui|nesta\s+sala|neste\s+quarto)\b'
  # Words that exclude it: "everywhere except here".
  this_room_except:
    - '\b(?:exceto|menos|n[ãa]o)\b'
  # Asking for an alarm and naming no time: ask when, never guess.
  alarm_no_time:
    - '^(?:acorda[\s-]me|acorde[\s-]me|p[õo]e\s+(?:um|o|meu)\s+alarme|coloca\s+(?:um|o|meu)\s+alarme)(?:\s+por\s+favor)?[\s.!?]*$'
  # An explicit request to remember something; only this stores a fact.
  remember_request:
    - '\blembra\b'
    - '\blembre\b'
    - '\bn[ãa]o\s+esque[çc]as\b'
    - '\bn[ãa]o\s+se\s+esque[çc]a\b'
    - '\bmemoriza\b'
    - '\bguarda\b'
    - '\banota\b'
  # An alarm the user wants to be woken by says alarm_wake; any other stays neutral.
  alarm_wake_request:
    - '\bacorda[\s-]*(?:me|nos)\b'
  # A calendar entry that repeats every year unless asked otherwise. A party is one day.
  yearly_event:
    - '(?<!festa\sde\s)\baniversário\b'
  # "When I say ...": a routine by phrase, which cannot be saved yet.
  phrase_routine:
    - '^(?:quando|se)\s+(?:eu\s+)?disser\b'

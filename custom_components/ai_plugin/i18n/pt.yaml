meta:
  code: "pt"
  name: "Português"
  contributors: []

labels:
  temperature: "temperatura"
  humidity: "humidade"
  co2: "CO₂"
  illuminance: "iluminação"
  pressure: "pressão"
  power: "potência"
  energy: "consumo"
  battery: "bateria"
  brightness: "brilho"

templates:
  attr_state:        "A {label} é {val}{unit}."
  attr_pct:          "A {label} está em {val}%."
  attr_humidity_fb:  "A {label} é {val}%."
  sun_set_at:        "O sol põe-se às {time}."
  sun_rise_at:       "O sol nasce às {time}."
  sun_is_up:         "O sol está alto. Põe-se às {time}."
  sun_is_down:       "O sol está baixo. Nasce às {time}."
  fallback_no_sensor: "Não tenho um sensor de {label} em {area}."
  err_no_answer:     "Não consegui produzir uma resposta. Tente reformular."
  err_process:       "Desculpe, não consegui processar isso."
  note_tool_limit:   "[Nota: limite de ferramentas atingido — a resposta pode estar incompleta.]"

  time_is:           "São {time}."
keywords:
  time_now:      ["que horas são", "que horas sao", "diga as horas"]
  sun_set:       ["pôr do sol", "quando se põe o sol", "a que horas se põe o sol"]
  sun_rise:      ["nascer do sol", "quando nasce o sol", "a que horas nasce o sol"]
  sun_dark:      ["está escuro", "está claro"]
  sun_is_up:     ["o sol está alto"]
  narration:     ["estou a verificar", "estou a procurar", "estou a olhar", "vou verificar", "vou procurar"]
  area_prefixes: ["na", "no", "em a", "em"]

patterns:
  narration_full: []
  sun_full:       []
  action_on:
    - '^(?:liga|ligar|ligue|ativa|ativar|acende|acender)\s+(?:o|a|os|as|um|uma)?\s*(?P<name>.+?)$'
  action_off:
    - '^(?:desliga|desligar|desligue|desativa|desativar|apaga|apagar)\s+(?:o|a|os|as)?\s*(?P<name>.+?)$'

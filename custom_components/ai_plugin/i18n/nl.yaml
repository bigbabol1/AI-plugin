meta:
  code: "nl"
  name: "Nederlands"
  contributors: []

# The nine sensor labels are capitalized because every template that uses
# them puts them first in the sentence; the three sweep labels stay
# lowercase because theirs sit mid-sentence ("alle lampen zijn uit").
labels:
  temperature: "Temperatuur"
  humidity: "Luchtvochtigheid"
  co2: "CO₂"
  illuminance: "Lichtsterkte"
  pressure: "Luchtdruk"
  power: "Vermogen"
  energy: "Energieverbruik"
  battery: "Batterijniveau"
  brightness: "Helderheid"
  lights: "lampen"
  fans: "ventilatoren"
  switches: "schakelaars"

# Sensor readouts carry no article on purpose: Dutch labels split over
# de-words (de temperatuur) and het-words (het vermogen), so a fixed "De
# {label}" would be wrong for half of them. Article-free is correct for both
# genders and is the normal register for reading a value out loud.
templates:
  attr_state:        "{label} is {val}{unit}."
  attr_pct:          "{label} is {val}%."
  attr_humidity_fb:  "{label} is {val}%."
  sun_set_at:        "De zon gaat onder om {time}."
  sun_rise_at:       "De zon komt op om {time}."
  sun_is_up:         "De zon is op. De zon gaat onder om {time}."
  sun_is_down:       "De zon is onder. De zon komt op om {time}."
  err_no_answer:     "Daar heb ik nu geen antwoord op. Probeer het anders te formuleren."
  err_process:       "Sorry, dat kon ik niet verwerken."
  err_action_failed: "Dat kon ik niet uitvoeren. Noem het apparaat of de kamer."
  sweep_all_on:  "OK, alle {label} zijn aan."
  sweep_all_off: "OK, alle {label} zijn uit."
  note_tool_limit:   "[Let op: limiet voor tool-aanroepen bereikt — het antwoord kan onvolledig zijn.]"
  tool_wait:         "Een momentje."

  time_is:           "Het is {time}."
  timer_done:        "De timer is afgelopen."
  timer_done_named:  "De timer {label} is afgelopen."
  phone_ringing:       "Ik laat je telefoon overgaan."
  phone_ringing_named: "Ik laat de telefoon van {name} overgaan."
  phone_seen_at:       "Home Assistant zag hem het laatst bij {place}."
  phone_seen_away:     "Home Assistant zag hem het laatst buiten de deur."
  phone_ring_text:     "Hier ben ik!"
  phone_failed:        "Ik kon de telefoon niet bereiken."
  alarm_ring:          "Je alarm gaat af."
  alarm_wake:          "Tijd om wakker te worden."
  alarm_stopped:       "Alarm uit."
  alarm_snoozed:       "Het alarm gaat over {val} minuten weer af."
  reminder_due:        "Herinnering: {label}."
  reminder_title:      "Herinnering"
  scheduled_say:       "{label}"
  scheduled_failed:    "Dit lukte niet: {label}."
  message_title:       "Bericht"
  message_title_from:  "Bericht van {name}"
  phrase_routine_refused: "Ik kan daar nog geen zin voor opslaan, dus er is niets ingesteld. Op een vast tijdstip kan het wel, als je zegt wanneer."
  remember_not_saved: "Dat heb ik niet opgeslagen. Als ik het moet onthouden, zeg dan onthoud en daarna wat."
  remember_not_saved_short: "Dat heb ik niet opgeslagen."
keywords:
  time_now:      ["hoe laat is het", "wat is de tijd", "zeg me de tijd", "hoe laat"]
  sun_set:       ["zonsondergang", "wanneer gaat de zon onder", "hoe laat gaat de zon onder", "wanneer is zonsondergang", "wanneer wordt het donker"]
  sun_rise:      ["zonsopkomst", "zonsopgang", "wanneer komt de zon op", "hoe laat komt de zon op", "wanneer is zonsopkomst"]
  sun_dark:      ["is het donker buiten", "is het donker", "is het licht buiten"]
  sun_is_up:     ["is de zon op", "staat de zon op"]
  narration:     ["ik controleer", "ik kijk even", "ik ga kijken", "ik ga controleren", "even kijken", "ik zoek"]

patterns:
  narration_full: []
  action_on:
    - '^(?:doe|zet|schakel|draai)\s+(?:de\s+|het\s+|een\s+)?(?P<name>.+?)\s+(?:aan|in)$'
    - '^activeer\s+(?:de\s+|het\s+|een\s+)?(?P<name>.+?)$'
    - '^(?P<name>.+?)\s+aan$'
  action_off:
    - '^(?:doe|zet|schakel|draai)\s+(?:de\s+|het\s+|een\s+)?(?P<name>.+?)\s+(?:uit|af)$'
    - '^deactiveer\s+(?:de\s+|het\s+|een\s+)?(?P<name>.+?)$'
    - '^(?P<name>.+?)\s+uit$'
  action_open:
    - '^(?:open|openen)\s+(?:de\s+|het\s+)?(?P<name>.+?)$'
    - '^(?:doe|zet|trek)\s+(?:de\s+|het\s+)?(?P<name>.+?)\s+open$'
    - '^(?P<name>.+?)\s+(?:openen|omhoog)$'
  action_close:
    - '^(?:sluit|sluiten)\s+(?:de\s+|het\s+)?(?P<name>.+?)$'
    - '^(?:doe|zet|trek)\s+(?:de\s+|het\s+)?(?P<name>.+?)\s+(?:dicht|toe)$'
    - '^(?P<name>.+?)\s+(?:sluiten|dicht|omlaag)$'
  # "Where is my phone": rings it. An optional
  # (?P<owner>...) captures someone else's name; without it the phone is the speaker's.
  find_phone:
    - '^waar\s+(?:is|ligt|heb\s+ik)\s+mijn\s+(?:telefoon|mobiel|gsm|iphone|smartphone)(?:\s+(?:gelaten|gelegd))?$'
    - '^(?:zoek|vind|bel)\s+mijn\s+(?:telefoon|mobiel|gsm|iphone|smartphone)$'
    - '^laat\s+mijn\s+(?:telefoon|mobiel|gsm|iphone|smartphone)\s+(?:rinkelen|afgaan|overgaan)$'
    - '^ik\s+kan\s+mijn\s+(?:telefoon|mobiel|gsm|iphone|smartphone)\s+niet\s+vinden$'
    - '^(?:waar\s+is|zoek)\s+de\s+(?:telefoon|mobiel|gsm|iphone|smartphone)\s+van\s+(?P<owner>[\w\-]+)$'
    - '^(?:waar\s+is|zoek)\s+(?P<owner>[\w\-]+?)(?:[\x27’]s|[\x27’])?\s+(?:telefoon|mobiel|gsm|iphone|smartphone)$'
  # While an alarm rings: the words that stop it.
  alarm_stop:
    - '^(?:stop|genoeg|uit|ik\s+ben\s+wakker|(?:stop|zet)\s+(?:de\s+)?(?:wekker|alarm)(?:\s+uit)?|wekker\s+uit)$'
  # While an alarm rings: snooze, with an optional (?P<minutes>).
  alarm_snooze:
    - '^(?:snooze|sluimer\w*)(?:\s+(?P<minutes>\d+)\s*min\w*)?$'
    - '^nog\s+(?P<minutes>\d+)\s+minuten?$'
  # A time in the future inside a command: such a command is scheduled, never run at once, and these are cut from it.
  later_time:
    - '\bover\s+(?:\d+|een|twee|drie|vijf|tien|vijftien|twintig|dertig|een\s+half|anderhalf)\s*(?:seconden?|minuten?|uur|uren)\b'
    - '\bom\s+\d{1,2}(?:[:.]\d{2})?(?!\s*%|\d)(?:\s*uur)?'
    - '(?<!goede\s)\bmorgen\b'
    - '\bvanavond\b'
    - '\blater\b'
    - '\b(?:elke|iedere)\s+dag\b'
  # A reply saying a fact was saved; said with nothing saved, it is replaced by remember_not_saved.
  saved_claim:
    - '\bik\s+heb\s+(?:het\s+|dat\s+)?(?:genoteerd|onthouden|opgeslagen)\b'
    - '\bik\s+zal\s+(?:het\s+|dat\s+)?onthouden\b'
    - '^genoteerd\b'
  # A command for the room the satellite is in.
  this_room:
    - '\b(?:hier|deze\s+kamer)\b'
  # Words that exclude it: "everywhere except here".
  this_room_except:
    - '\b(?:behalve|niet)\b'
  # Asking for an alarm and naming no time: ask when, never guess.
  alarm_no_time:
    - '^(?:maak\s+me\s+wakker|zet\s+(?:een|de|mijn)\s+(?:wekker|alarm))(?:\s+alsjeblieft)?[\s.!?]*$'
  # An explicit request to remember something; only this stores a fact.
  remember_request:
    - '\bonthoud\b'
    - '\bvergeet\s+niet\b'
    - '\bnoteer\b'
    - '\bsla\b.*\bop\b'
    - '\bbewaar\b'
  # An alarm the user wants to be woken by says alarm_wake; any other stays neutral.
  alarm_wake_request:
    - '\bmaak\s+(?:me|mij|ons)\b.*\bwakker\b'
  # A calendar entry that repeats every year unless asked otherwise. A party is one day.
  yearly_event:
    - '\bverjaardag\b'
  # "When I say ...": a routine by phrase, which cannot be saved yet.
  phrase_routine:
    - '^(?:als|wanneer)\s+(?:ik|we)\s+.*\bzeg(?:gen)?\b'

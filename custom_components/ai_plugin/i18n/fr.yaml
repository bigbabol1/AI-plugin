keywords:
  time_now:      ["quelle heure est-il", "quelle heure il est", "l'heure actuelle"]
  sun_set:       ["coucher du soleil", "se couche le soleil", "à quelle heure se couche le soleil"]
  sun_rise:      ["lever du soleil", "se lève le soleil", "à quelle heure se lève le soleil"]
  sun_dark:      ["fait-il nuit", "fait-il jour"]
  sun_is_up:     ["le soleil est-il levé"]
  narration:     ["je vérifie", "je cherche", "je regarde", "je consulte", "je recherche", "je vais vérifier", "je vais chercher", "je vais regarder"]

patterns:
  narration_full: []
  action_on:
    - '^(?:allume|allumer|allumez|active|activer)\s+(?:le|la|les|l''|l’|un|une)?\s*(?P<name>.+?)$'
  action_off:
    - '^(?:éteins|eteins|éteindre|éteignez|désactive|desactive|coupe)\s+(?:le|la|les|l''|l’)?\s*(?P<name>.+?)$'
  action_open:
    - '^(?:ouvre|ouvrir)\s+(?:le\s+|la\s+|les\s+|l[\x27’]\s*)?(?P<name>.+?)$'
  action_close:
    - '^(?:ferme|fermer)\s+(?:le\s+|la\s+|les\s+|l[\x27’]\s*)?(?P<name>.+?)$'
  # "Where is my phone": rings it. An optional
  # (?P<owner>...) captures someone else's name; without it the phone is the speaker's.
  find_phone:
    - '^(?:où|ou)\s+(?:est|se\s+trouve)\s+mon\s+(?:téléphone|telephone|portable|mobile|iphone|smartphone)$'
    - '^(?:où|ou)\s+(?:ai-je|j[\x27’]ai)\s+(?:mis|laissé|laisse)\s+mon\s+(?:téléphone|telephone|portable|mobile|iphone|smartphone)$'
    - '^(?:fais|faites)\s+sonner\s+mon\s+(?:téléphone|telephone|portable|mobile|iphone|smartphone)$'
    - '^(?:trouve|retrouve|localise)\s+mon\s+(?:téléphone|telephone|portable|mobile|iphone|smartphone)$'
    - '^je\s+(?:ne\s+)?trouve\s+(?:pas|plus)\s+mon\s+(?:téléphone|telephone|portable|mobile|iphone|smartphone)$'
    - '^(?:(?:où|ou)\s+est|fais\s+sonner|trouve)\s+le\s+(?:téléphone|telephone|portable|mobile|iphone|smartphone)\s+(?:de\s+|d[\x27’]\s*)(?P<owner>[\w\-]+)$'
  # While an alarm rings: the words that stop it.
  alarm_stop:
    - '^(?:stop|arrête|arrete|assez|éteins|je\s+suis\s+réveillée?|(?:arrête|arrete|éteins|coupe)\s+(?:le\s+réveil|l[\x27’]alarme))$'
  # While an alarm rings: snooze, with an optional (?P<minutes>).
  alarm_snooze:
    - '^snooze(?:\s+(?P<minutes>\d+)\s*min\w*)?$'
    - '^encore\s+(?P<minutes>\d+)\s+minutes?$'
  # A time in the future inside a command: such a command is scheduled, never run at once, and these are cut from it.
  later_time:
    - '\bdans\s+(?:\d+|une?|deux|trois|cinq|dix|quinze|vingt|trente|une\s+demi[\s-])\s*(?:secondes?|minutes?|heures?)\b'
    - '\bà\s+\d{1,2}\s*h(?:eures?)?(?:\s*\d{2})?'
    - '\bdemain\b'
    - '\bce\s+soir\b'
    - '\bplus\s+tard\b'
    - '\btous\s+les\s+(?:jours|matins|soirs)\b'
  # A reply saying a fact was saved; said with nothing saved, it is replaced by remember_not_saved.
  saved_claim:
    - '\bc[\x27’]est\s+not[ée]\b'
    - '\bj[\x27’]ai\s+(?:not[ée]|enregistr[ée]|m[ée]moris[ée]|retenu)\b'
    - '\bje\s+me\s+souviendrai\b'
    - '\bje\s+retiens\b'
  # A command for the room the satellite is in.
  this_room:
    - '\b(?:ici|cette\s+pi[èe]ce)\b'
  # Words that exclude it: "everywhere except here".
  this_room_except:
    - '\b(?:sauf|pas)\b'
  # Asking for an alarm and naming no time: ask when, never guess.
  alarm_no_time:
    - '^(?:s[\x27’]il\s+te\s+pla[iî]t\s+)?(?:r[ée]veille[\s-]moi|mets?\s+(?:une|l[\x27’]|mon)\s*(?:alarme|r[ée]veil))(?:\s+s[\x27’]il\s+te\s+pla[iî]t)?[\s.!?]*$'
  # An explicit request to remember something; only this stores a fact.
  remember_request:
    - '\bretiens\b'
    - '\bsouviens[\s-]toi\b'
    - '\bn[\x27’]oublie\s+pas\b'
    - '\bm[ée]morise\b'
    - '\bnote\b'
    - '\benregistre\b'
  # An alarm the user wants to be woken by says alarm_wake; any other stays neutral.
  alarm_wake_request:
    - '\bréveille[sz]?[\s-]*(?:moi|nous)\b'
  # A calendar entry that repeats every year unless asked otherwise. A party is one day.
  yearly_event:
    - '(?<!fête\sd\x27)(?<!fete\sd\x27)\banniversaire\b'
  # "When I say ...": a routine by phrase, which cannot be saved yet.
  phrase_routine:
    - '^(?:quand|si)\s+(?:je\s+dis|on\s+dit)\b'

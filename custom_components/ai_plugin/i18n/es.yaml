  timer_done:        "El temporizador ha terminado."
  timer_done_named:  "El temporizador {label} ha terminado."
  phone_ringing:       "Hago sonar tu teléfono."
  phone_ringing_named: "Hago sonar el teléfono de {name}."
  phone_seen_at:       "Home Assistant lo vio por última vez en {place}."
  phone_seen_away:     "Home Assistant lo vio por última vez fuera de casa."

  phone_seen_at:       "Laut Home Assistant war es zuletzt bei {place}."
  phone_seen_away:     "Laut Home Assistant war es zuletzt nicht zu Hause."
  phone_ring_text:     "Hier bin ich!"
  phone_failed:        "Ich konnte das Handy nicht erreichen."
  alarm_ring:          "Dein Alarm klingelt."
  alarm_wake:          "Zeit aufzuwachen."
  alarm_stopped:       "Alarm aus."
  alarm_snoozed:       "Der Alarm klingelt in {val} Minuten wieder."
  reminder_due:        "Erinnerung: {label}."
  reminder_title:      "Erinnerung"
  scheduled_say:       "{label}"
  scheduled_failed:    "Das konnte ich nicht ausführen: {label}."
  message_title:       "Nachricht"
  message_title_from:  "Nachricht von {name}"
  phrase_routine_refused: "Einen Satz dafür kann ich mir noch nicht merken, also ist nichts eingestellt. Zu einer festen Uhrzeit geht es, sag mir dann wann."
  remember_not_saved: "Das habe ich nicht gespeichert. Wenn ich es behalten soll, sag merk dir und dann, was."
  remember_not_saved_short: "Das habe ich nicht gespeichert."
  second_room_refused: "Ich kann nicht in zwei Räumen gleichzeitig spielen. Ich kann die Musik aber verschieben."
  broadcast_what: "Was soll ich durchsagen?"
  broadcast_sent: "Ich habe es in allen anderen Räumen gesagt."
  broadcast_failed: "Das konnte ich nicht durchsagen."
  broadcast_cancelled: "Okay, keine Durchsage."
  message_sent_to: "An {name} geschickt: {label}"
  message_not_sent: "Das konnte ich nicht senden."
  message_cancelled: "Okay, nichts gesendet."
  schedule_not_changed: "Ich habe nichts geändert. Sag mir die neue Zeit, dann stelle ich sie ein."
keywords:
  time_now:      ["wie spät ist es", "wie viel uhr ist es", "wieviel uhr ist es", "sag mir die uhrzeit", "wie spät"]
  sun_set:       ["sonnenuntergang", "wann geht die sonne unter", "wann ist sonnenuntergang"]
  sun_rise:      ["sonnenaufgang", "wann geht die sonne auf", "wann ist sonnenaufgang"]
  sun_dark:      ["ist es dunkel", "ist es hell"]
  sun_is_up:     ["ist die sonne oben", "ist die sonne auf"]
  narration:     ["ich prüfe", "ich überprüfe", "ich checke", "ich suche nach", "ich schaue", "ich sehe nach", "ich frage"]

patterns:
  narration_full: []
  action_on:
    - '^(?:schalte|mach|stell|stelle|dreh|drehe)\s+(?:den|die|das|dem)?\s*(?P<name>.+?)\s+(?:ein|an)$'
    - '^(?P<name>.+?)\s+(?:ein|an)$'
  action_off:
    - '^(?:schalte|mach|stell|stelle|dreh|drehe)\s+(?:den|die|das|dem)?\s*(?P<name>.+?)\s+aus$'
    - '^(?P<name>.+?)\s+aus$'
  action_open:
    - '^(?:öffne|oeffne)\s+(?:den|die|das|dem)?\s*(?P<name>.+?)$'
    - '^mach(?:e)?\s+(?:den|die|das|dem)?\s*(?P<name>.+?)\s+auf$'
    - '^(?P<name>.+?)\s+(?:öffnen|aufmachen|hoch(?:fahren)?)$'
  action_close:
    - '^(?:schließe|schliesse)\s+(?:den|die|das|dem)?\s*(?P<name>.+?)$'
    - '^mach(?:e)?\s+(?:den|die|das|dem)?\s*(?P<name>.+?)\s+zu$'
    - '^(?P<name>.+?)\s+(?:schließen|schliessen|zumachen|runter(?:fahren)?)$'
  # "Where is my phone": rings it. An optional
  # (?P<owner>...) captures someone else's name; without it the phone is the speaker's.
  find_phone:
    - '^(?:wo\s+ist|wo\s+liegt|wo\s+hab(?:e)?\s+ich)\s+mein\s+(?:handy|telefon|smartphone|iphone)(?:\s+(?:hingelegt|gelassen|liegen\s+lassen))?$'
    - '^(?:finde|such(?:e)?|orte|klingel(?:e)?|ruf(?:e)?)\s+mein\s+(?:handy|telefon|smartphone|iphone)(?:\s+an)?$'
    - '^(?:lass|lasse|mach)\s+mein\s+(?:handy|telefon|smartphone|iphone)\s+klingeln$'
    - '^ich\s+finde\s+mein\s+(?:handy|telefon|smartphone|iphone)\s+nicht$'
    - '^(?:wo\s+ist|wo\s+liegt|finde|such(?:e)?)\s+(?:das\s+)?(?:handy|telefon|smartphone|iphone)\s+von\s+(?P<owner>[\w\-]+)$'
    - '^(?:wo\s+ist|wo\s+liegt|finde|such(?:e)?)\s+(?P<owner>[\w\-]+?)[\x27’]?\s+(?:handy|telefon|smartphone|iphone)$'
  # While an alarm rings: the words that stop it.
  alarm_stop:
    - '^(?:stopp?|aus|ruhe|genug|ich\s+bin\s+(?:wach|auf)|(?:wecker|alarm)\s+(?:aus|stopp?(?:en)?)|(?:mach|schalte?|stell)\s+(?:den\s+wecker|den\s+alarm|ihn|das|es)\s+(?:aus|ab)|(?:beende|stoppe)\s+(?:den\s+)?(?:wecker|alarm))$'
  # While an alarm rings: snooze, with an optional (?P<minutes>).
  alarm_snooze:
    - '^(?:schlummer\w*|snooze)(?:\s+(?:für\s+)?(?P<minutes>\d+)\s*min\w*)?$'
    - '^noch\s+(?P<minutes>\d+)\s*minuten?$'
  # A time in the future inside a command: such a command is scheduled, never run at once, and these are cut from it.
  later_time:
    - '\bin\s+(?:\d+|einer|einem|zwei|drei|vier|fünf|zehn|fünfzehn|zwanzig|dreißig|einer\s+halben)\s+(?:sekunden?|minuten?|stunden?)\b'
    - '\bin\s+einer\s+(?:viertel|drei\s*viertel)\s*stunde\b'
    - '\bum\s+\d{1,2}(?:[:.]\d{2})?(?!\s*(?:%|prozent|grad)|\d)(?:\s*uhr)?'
    - '(?<!guten\s)(?<!heute\s)\bmorgen(?:\s+früh)?\b'
    - '\bheute\s+abend\b'
    - '\b(?:später|nachher)\b'
    - '\bjeden\s+(?:tag|morgen|abend|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b'
  # A reply saying a fact was saved; said with nothing saved, it is replaced by remember_not_saved.
  saved_claim:
    - '\b(?:ich\s+habe|habe\s+ich)\s+(?:(?:mir|das|es)\s+)*(?:gemerkt|notiert|gespeichert)\b'
    - '\bich\s+merke\s+(?:(?:mir|das|es)\s+)+'
    - '\bmerke\s+ich\s+mir\b'
    - '\bich\s+werde\s+(?:(?:mir|das|es)\s+)*(?:merken|behalten|notieren|speichern)\b'
    - '^notiert\b'
    - '\bist\s+notiert\b'
  # A reply saying a reminder or alarm was moved. Checked against what the turn really did.
  schedule_changed_claim:
    - '(?<!nicht\s)\b(?:aktualisiert|geändert|verschoben|angepasst|korrigiert|umgestellt)\b'
  # Words for a reminder or alarm, to tell such a claim from one about a calendar entry.
  schedule_thing:
    - '\b(?:erinnerung(?:en)?|wecker|alarme?)\b'
  # A user correcting something they just asked for: a new reminder then replaces its old twin.
  schedule_correction:
    - '\b(?:mein\s+fehler|eigentlich|stattdessen|ich\s+meinte|sorry|entschuldigung|korrektur|falsch|änder\w*|verschieb\w*|aktualisier\w*)\b'
    - '^nein\b'
  # A user asking for one more: the old reminder stays even if the wording sounds like a correction.
  schedule_keep_both:
    - '\b(?:auch|zusätzlich|noch\s+eine\w*|weitere\w*|zweite\w*)\b'
  # A command for the room the satellite is in.
  # The room something is moved to is the speaker's own: "move the music here".
  move_here:
    - '\b(?:hierher|hierhin|hier\s+her)\b'
    - '\bin\s+(?:diesen\s+raum|dieses\s+zimmer)\b'
    - '(?<!\bvon\s)\b(?:hier|in\s+diesem\s+(?:raum|zimmer))(?:\s+(?:bitte|jetzt))?[\s.!?]*$'
  # A reply saying something was done. With nothing done, it is replaced by err_action_failed.
  action_done_claim:
    - '(?:^|[.!?,]\s+)ich\s+habe\s+(?!.*\b(?:nicht|nichts|kein\w*)\b).*\b(?:durchgesagt|angekündigt|verschoben|hinzugefügt|entfernt|gelöscht|ausgeschaltet|eingeschaltet|angeschaltet|abgeschaltet|gedimmt|pausiert|gestoppt|gestartet|abgespielt|geändert|erledigt)\b'
  # Music in a second room as well, which the plugin cannot do: "also play in the bathroom".
  second_room:
    - '\b(?:spiel\w*|abspielen)\b.*\b(?:auch|zus[äa]tzlich)\s+(?:im|in|auf|hier|dort|da)\b'
    - '\b(?:auch|zus[äa]tzlich)\s+(?:im|in|auf|hier|dort|da)\b.*\b(?:spiel\w*|abspielen)\b'
    - '\b(?:spiel\w*|abspielen|musik)\b.*\b(?:beiden|zwei|mehreren)\s+(?:r[äa]umen|zimmern|lautsprechern)\b'
  # "Broadcast." and nothing to say yet: the next thing said is the message.
  broadcast_empty:
    - '^(?:bitte\s+)?(?:durchsage|ansage|broadcast|(?:mach|sende)\s+eine\s+(?:durchsage|ansage)|etwas\s+durchsagen)(?:\s+bitte)?$'
  # Asking for an announcement, in any wording, and the assistant asking what to say.
  broadcast_word:
    - '\b(?:durchsage|durchsagen|ansage|ansagen|broadcast)\b'
  # Taking that back instead of giving the message.
  broadcast_cancel:
    - '^(?:nein[,\s]+)?(?:vergiss\s+es|abbrechen|abbruch|nichts|egal|schon\s+gut|stopp?)(?:\s+bitte)?$'
  # The assistant asking what to say to one person: the next thing said is the message.
  message_asked:
    - '^(?:und\s+)?(?:was\b|welche\s+nachricht\b).*\b(?:sagen|schreiben|senden|schicken|ausrichten|mitteilen)\b'
  # Correcting who a message is for: not itself a message.
  message_correction:
    - '^(?:nein[,\s]+)?nicht\s+(?:an|zu|für)\b'
    - '\b(?:die|der|den|das|dem)\s+ander'
  # A reply saying a message went out. "Already sent" stays out: it can be true.
  message_sent_claim:
    - '(?:^|[.!?,]\s+)ich\s+habe\s+(?!.*\b(?:nicht|nichts|kein\w*|schon|bereits)\b).*\b(?:geschickt|gesendet|geschrieben|weitergeleitet|ausgerichtet)\b'
    - '\bnachricht\s+wurde\s+(?:gesendet|geschickt)\b'
  this_room:
    - '\b(?:hier|diesem\s+raum|diesem\s+zimmer)\b'
  # Words that exclude it: "everywhere except here".
  this_room_except:
    - '\b(?:außer|ausser|nicht)\b'
  # Asking for an alarm and naming no time: ask when, never guess.
  alarm_no_time:
    - '^(?:bitte\s+)?(?:weck(?:e)?\s+mich(?:\s+auf)?|stell(?:e)?\s+(?:einen|den|meinen)\s+wecker|stell(?:e)?\s+(?:einen|den)\s+alarm)(?:\s+bitte)?[\s.!?]*$'
  # An explicit request to remember something; only this stores a fact.
  remember_request:
    - '\bmerk(?:e|t|en)?\b'
    - '\bnotier\w*\b'
    - '\bspeicher\w*\b'
    - '\bvergiss\s+nicht\b'
    - '\bnicht\s+vergessen\b'
    - '\berinner\w*\s+dich\b'
    - '\bbehalt\w*\b'
  # An alarm the user wants to be woken by says alarm_wake; any other stays neutral.
  alarm_wake_request:
    - '\bweck\w*\s+(?:mich|uns)\b'
  # A calendar entry that repeats every year unless asked otherwise. A party is one day.
  yearly_event:
    - '\bgeburtstag\b(?!\s+feier)'
  # "When I say ...": a routine by phrase, which cannot be saved yet.
  phrase_routine:
    - '^(?:wenn|immer\s+wenn)\s+(?:ich|wir)\s+.*\bsagen?\b'

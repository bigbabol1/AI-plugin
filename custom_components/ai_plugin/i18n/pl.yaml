keywords:
  time_now:      ["która jest godzina", "ktora jest godzina", "podaj godzinę"]
  sun_set:       ["zachód słońca", "kiedy zachodzi słońce", "o której zachodzi słońce"]
  sun_rise:      ["wschód słońca", "kiedy wschodzi słońce", "o której wschodzi słońce"]
  sun_dark:      ["jest ciemno", "jest jasno"]
  sun_is_up:     ["czy słońce jest"]
  narration:     ["sprawdzam", "szukam", "patrzę", "zaraz sprawdzę", "zaraz poszukam"]

patterns:
  narration_full: []
  action_on:
    - '^(?:włącz|wlacz|włączyć|wlaczyc|uruchom)\s+(?P<name>.+?)$'
  action_off:
    - '^(?:wyłącz|wylacz|wyłączyć|wylaczyc|zatrzymaj)\s+(?P<name>.+?)$'
  action_open:
    - '^(?:otwórz|otworz)\s+(?P<name>.+?)$'
  action_close:
    - '^(?:zamknij)\s+(?P<name>.+?)$'
  # "Where is my phone": rings it. An optional
  # (?P<owner>...) captures someone else's name; without it the phone is the speaker's.
  find_phone:
    - '^gdzie\s+jest\s+(?:mój|moj|moja)\s+(?:telefon|komórka|komorka|iphone|smartfon)$'
    - '^(?:znajdź|znajdz|zadzwoń\s+na|zadzwon\s+na)\s+(?:mój|moj|moją|moja)\s+(?:telefon|komórkę|komorke|iphone|smartfon)$'
    - '^nie\s+(?:mogę|moge)\s+znaleźć\s+(?:mojego\s+|swojego\s+)?(?:telefonu|komórki|komorki|smartfona)$'
    - '^gdzie\s+jest\s+(?:telefon|komórka|komorka)\s+(?P<owner>[\w\-]+)$'
  # While an alarm rings: the words that stop it.
  alarm_stop:
    - '^(?:stop|dość|dosc|wyłącz|wylacz|cisza|już\s+wstaję|(?:wyłącz|wylacz|zatrzymaj)\s+(?:budzik|alarm))$'
  # While an alarm rings: snooze, with an optional (?P<minutes>).
  alarm_snooze:
    - '^(?:drzemka|snooze)(?:\s+(?P<minutes>\d+)\s*min\w*)?$'
    - '^jeszcze\s+(?P<minutes>\d+)\s+minut\w*$'
  # A time in the future inside a command: such a command is scheduled, never run at once, and these are cut from it.
  later_time:
    - '\bza\s+(?:\d+|dwie|trzy|pięć|dziesięć)\s+(?:sekund\w*|minut\w*|godzin\w*)\b'
    - '\bza\s+(?:godzinę|godzine|pół\s+godziny|kwadrans)\b'
    - '\bo\s+(?:godzinie\s+)?\d{1,2}(?:[:.]\d{2})?(?!\s*%|\d)'
    - '\bjutro\b'
    - '\bdziś\s+wieczorem\b'
    - '\bpóźniej\b'
    - '\bcodziennie\b'
  # An alarm the user wants to be woken by says alarm_wake; any other stays neutral.
  alarm_wake_request:
    - '\bobud[zź]\s+(?:mnie|nas)\b'
  # A calendar entry that repeats every year unless asked otherwise. A party is one day.
  yearly_event:
    - '\burodzin(?:y|ach|om)?\b'
  # "When I say ...": a routine by phrase, which cannot be saved yet.
  phrase_routine:
    - '^(?:kiedy|gdy|jak)\s+powiem\b'

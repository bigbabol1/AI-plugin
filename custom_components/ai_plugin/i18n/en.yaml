keywords:
  time_now:      ["what time is it", "what is the time", "what's the time", "tell me the time", "current time"]
  sun_set:       ["when is sunset", "sunset", "when does the sun set", "when does the sun go down", "when does it get dark"]
  sun_rise:      ["when is sunrise", "sunrise", "when does the sun rise", "when does the sun come up"]
  sun_dark:      ["is it dark outside", "is it light outside"]
  sun_is_up:     ["is the sun up", "is the sun out"]
  narration:     ["i'm checking", "i am checking", "i'm looking", "i'm finding", "i'm searching"]

patterns:
  narration_full: []
  # Single named-device on/off (deterministic, bypasses the LLM). Each
  # regex must capture the device as (?P<name>...). Compiled IGNORECASE.
  action_on:
    - '^(?:turn|switch|flip|put)\s+on\s+(?:the\s+|a\s+)?(?P<name>.+?)$'
    - '^(?:turn|switch|flip|put)\s+(?:the\s+|a\s+)?(?P<name>.+?)\s+on$'
    - '^(?P<name>.+?)\s+on$'
  action_off:
    - '^(?:turn|switch|flip|put)\s+off\s+(?:the\s+|a\s+)?(?P<name>.+?)$'
    - '^(?:turn|switch|flip|put)\s+(?:the\s+|a\s+)?(?P<name>.+?)\s+off$'
    - '^(?P<name>.+?)\s+off$'
  # Cover open/close for a single named cover (blinds, shutters, garage).
  action_open:
    - '^(?:open|raise)\s+(?:the\s+|a\s+)?(?P<name>.+?)$'
  action_close:
    - '^(?:close|shut|lower)\s+(?:the\s+|a\s+)?(?P<name>.+?)$'
  # "Where is my phone": rings it. An optional
  # (?P<owner>...) captures someone else's name; without it the phone is the speaker's.
  find_phone:
    - '^(?:where[\x27’]s|where\s+is|where\s+did\s+i\s+(?:put|leave))\s+my\s+(?:mobile\s+|cell\s+)?(?:phone|mobile|cellphone|smartphone|iphone)$'
    - '^(?:find|ring|locate|call)\s+my\s+(?:mobile\s+|cell\s+)?(?:phone|mobile|cellphone|smartphone|iphone)$'
    - '^make\s+my\s+(?:mobile\s+|cell\s+)?(?:phone|mobile|cellphone|smartphone|iphone)\s+ring$'
    - '^i\s+can(?:[\x27’]t|not|\s+not)\s+find\s+my\s+(?:mobile\s+|cell\s+)?(?:phone|mobile|cellphone|smartphone|iphone)$'
    - '^(?:where[\x27’]s|where\s+is|find|ring|locate|call)\s+(?P<owner>[\w\-]+?)(?:[\x27’]s|s[\x27’])?\s+(?:mobile\s+|cell\s+)?(?:phone|mobile|cellphone|smartphone|iphone)$'
  # While an alarm rings: the words that stop it.
  alarm_stop:
    - '^(?:stop|stop\s+it|enough|off|quiet|(?:i[\x27’]?m|i\s+am)\s+(?:up|awake)|dismiss(?:\s+it)?|(?:stop|cancel|dismiss)\s+(?:the\s+)?alarm|(?:turn|switch)\s+(?:the\s+alarm|it)\s+off|(?:turn|switch)\s+off\s+(?:the\s+)?alarm|alarm\s+off)$'
  # While an alarm rings: snooze, with an optional (?P<minutes>).
  alarm_snooze:
    - '^snooze(?:\s+(?:it|the\s+alarm))?(?:\s+for)?(?:\s+(?P<minutes>\d+)\s*(?:minutes?|mins?))?$'
    - '^(?P<minutes>\d+)\s+more\s+minutes?$'
  # A time in the future inside a command: such a command is scheduled, never run at once, and these are cut from it.
  later_time:
    - '\bin\s+(?:\d+|a|an|one|two|three|four|five|six|ten|fifteen|twenty|thirty|forty[\s-]five|half\s+an?|a\s+quarter\s+of\s+an|a\s+couple\s+of)\s+(?:seconds?|minutes?|mins?|hours?|hrs?)\b'
    - '\bat\s+\d{1,2}(?::\d{2})?(?!\s*(?:%|percent|degrees?)|\d)(?:\s*(?:[ap]\.?m\.?|o[\x27’]?clock))?'
    - '\b(?:tomorrow|tonight|later)\b'
    - '\bthis\s+(?:evening|afternoon)\b'
    - '\bevery\s+(?:day|morning|evening|night|weekday|week|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b'
  # A reply saying a fact was saved; said with nothing saved, it is replaced by remember_not_saved.
  saved_claim:
    - '\bi(?:[\x27’]ve|\s+have)\s+(?:noted|saved|remembered|made\s+a\s+note)\b'
    - '\bi(?:[\x27’]ll|\s+will)\s+(?:make\s+sure\s+to\s+)?(?:remember|keep\s+that\s+in\s+mind|make\s+a\s+note)\b'
    - '^noted\b'
  # A reply saying a reminder or alarm was moved. Checked against what the turn really did.
  schedule_changed_claim:
    - '(?<!n[\x27’]t\s)(?<!not\s)\b(?:updated|changed|moved|rescheduled|adjusted|corrected|shifted)\b'
  # Words for a reminder or alarm, to tell such a claim from one about a calendar entry.
  schedule_thing:
    - '\b(?:reminders?|alarms?)\b'
  # A user correcting something they just asked for: a new reminder then replaces its old twin.
  schedule_correction:
    - '\b(?:my\s+bad|actually|instead|i\s+mean|i\s+meant|sorry|correction|mistake|wrong|change|move|reschedule|update)\b'
    - '^no\b'
  # A user asking for one more: the old reminder stays even if the wording sounds like a correction.
  schedule_keep_both:
    - '\b(?:also|too|as\s+well|another|additional|second|extra)\b'
  # A command for the room the satellite is in.
  # The room something is moved to is the speaker's own: "move the music here".
  move_here:
    - '\b(?:to|into|over\s+to)\s+this\s+room\b'
    - '\b(?:to|over|back)\s+here\b'
    - '(?<!\bfrom\s)\b(?:here|in\s+this\s+room)(?:\s+(?:please|now))?[\s.!?]*$'
  # A reply saying something was done. With nothing done, it is replaced by err_action_failed.
  action_done_claim:
    - '(?:^|[.!?,]\s+)i(?:[\x27’]ve|\s+have)?\s+(?:just\s+|now\s+|already\s+)?(?:broadcast(?:ed)?|announced|moved|added|removed|deleted|turned|switched|dimmed|paused|stopped|started|played|changed|completed|cancell?ed)\b'
  # Music in a second room as well, which the plugin cannot do: "also play in the bathroom".
  second_room:
    - '\balso\s+play\b.*\b(?:in|on\s+the|here|there)\b'
    - '\bplay\b.*\b(?:in|on\s+the|here|there)\b.*\b(?:also|too|as\s+well)\b'
    - '\bplay\b.*\b(?:also|too|as\s+well)\s+(?:in|on\s+the|here|there)\b'
    - '\b(?:play|music|playback)\b.*\b(?:both|two|multiple|several)\s+(?:rooms?|speakers?)\b'
  # "Broadcast." and nothing to say yet: the next thing said is the message.
  broadcast_empty:
    - '^(?:please\s+)?(?:broadcast|announce|make\s+an\s+announcement|send\s+a\s+broadcast)(?:\s+(?:something|please))?$'
  # Asking for an announcement, in any wording, and the assistant asking what to say.
  broadcast_word:
    - '\b(?:broadcast|announce|announcement)\b'
  # Taking that back instead of giving the message.
  broadcast_cancel:
    - '^(?:no[,\s]+)?(?:never\s*mind|cancel|forget\s+it|nothing|stop)(?:\s+(?:it|that|please))?$'
  # The assistant asking what to say to one person: the next thing said is the message.
  message_asked:
    - '^(?:and\s+)?what\b.*\b(?:say|send|message|tell|write)\b'
  # Correcting who a message is for: not itself a message.
  message_correction:
    - '^(?:no[,\s]+)?not\s+to\b'
    - '\bthe\s+other\s+(?:one|person)\b'
  # A reply saying a message went out. "Already sent" stays out: it can be true.
  message_sent_claim:
    - '(?:^|[.!?,]\s+)i(?:[\x27’]ve|\s+have)?\s+(?:just\s+|now\s+)?(?:sent|texted|forwarded|passed)\b'
    - '\bmessage\s+(?:has\s+been|was)\s+sent\b'
  this_room:
    - '\b(?:here|this\s+room)\b'
  # Words that exclude it: "everywhere except here".
  this_room_except:
    - '\b(?:except|but|not|apart\s+from|other\s+than)\b'
  # Asking for an alarm and naming no time: ask when, never guess.
  alarm_no_time:
    - '^(?:please\s+)?(?:wake\s+me(?:\s+up)?|get\s+me\s+up|set\s+(?:an?|the|my)\s+alarm)(?:\s+please)?[\s.!?]*$'
  # An explicit request to remember something; only this stores a fact.
  remember_request:
    - '\bremember\b'
    - '\bdon[\x27’]?t\s+forget\b'
    - '\bdo\s+not\s+forget\b'
    - '\bmake\s+a\s+note\b'
    - '\bkeep\s+in\s+mind\b'
    - '\bnote\s+(?:that|this|down)\b'
    - '\bsave\s+(?:that|this)\b'
  # An alarm the user wants to be woken by says alarm_wake; any other stays neutral.
  alarm_wake_request:
    - '\b(?:wake\s+(?:me|us)|get\s+(?:me|us)\s+up)\b'
  # A calendar entry that repeats every year unless asked otherwise. A party is one day.
  yearly_event:
    - '\b(?:birthday|bday)\b(?!\s+(?:party|dinner|lunch|brunch|cake|present|gift|celebration|card|shopping))'
  # "When I say ...": a routine by phrase, which cannot be saved yet.
  phrase_routine:
    - '^(?:when(?:ever)?|if)\s+(?:i|we)\s+say\b'

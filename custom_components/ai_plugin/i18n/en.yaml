  broadcast_what: "What should I announce?"
  broadcast_sent: "I've told every other room."
  broadcast_failed: "I couldn't announce that."
  broadcast_cancelled: "Okay, nothing announced."
  message_sent_to: "Sent to {name}: {label}"
  message_not_sent: "I couldn't send that."
  message_cancelled: "Okay, nothing sent."
